; ---- IP Call Panel: base PJSIP config ----
; Trunks and extensions are generated by the panel into pjsip_ipcall.conf (included below).

[global]
type=global
user_agent=IPCallPanel

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Behind NAT (most VPS are not), set these to your public IP:
;external_media_address=YOUR.PUBLIC.IP
;external_signaling_address=YOUR.PUBLIC.IP

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

#include pjsip_ipcall.conf
