; ---- IP Call Panel dialplan ----
; Outbound calls are originated directly into the Stasis app by the panel, so no outbound dialplan is needed.

[ipcall-inbound]
; Calls arriving on a trunk run the user's Welcome Voice + IVR settings.
exten => _X.,1,NoOp(Inbound on trunk ${IPCALL_TRUNK} from ${CALLERID(num)})
 same => n,Stasis(ipcall,in,${IPCALL_TRUNK})
 same => n,Hangup()
exten => s,1,Goto(ipcall-inbound,0,1)

[ipcall-agents]
; Extensions (agents) only receive transferred calls; they cannot dial out.
exten => _X.,1,Hangup(21)
